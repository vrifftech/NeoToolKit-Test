name: Build and package NeoToolKit-Test

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  repository_dispatch:
    types: [neoshared-updated, neotoolkit-component-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEOTOOLKIT_BUILD_JOBS: '2'

jobs:
  sources:
    name: Resolve and verify one matched source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha256: ${{ steps.resolve.outputs.source_sha256 }}
      version: ${{ steps.resolve.outputs.version }}
      host_sha: ${{ steps.resolve.outputs.host_sha }}
    steps:
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: NeoToolKit-Test
          persist-credentials: false
      - name: Fetch latest main branches and archive exact sources
        id: resolve
        shell: bash
        run: >-
          cmake "-DNEO_CI_WORKSPACE=$GITHUB_WORKSPACE"
          -P NeoToolKit-Test/scripts/ci/PrepareSources.cmake
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neotoolkit-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native:
    name: ${{ matrix.label }}
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
          - label: Windows x64 (VS 2026)
            runner: windows-2025-vs2026
            artifact: windows-x64
          - label: macOS 15 Apple Silicon
            runner: macos-15
            artifact: macos-arm64
          - label: macOS 15 Intel
            runner: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      NEOTOOLKIT_EXPECTED_PLATFORM: ${{ matrix.artifact }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Download the common source snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neotoolkit-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-bundle
      - name: Verify snapshot checksum and extract
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.sources.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          actual="$(cmake -E sha256sum source-bundle/workspace-sources.tar.gz | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_SHA"
          tar -xzf source-bundle/workspace-sources.tar.gz
      - name: Install Linux SDK and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config libwxgtk3.2-dev zlib1g-dev libspng-dev libjpeg-dev \
            dpkg-dev fakeroot binutils
      - name: Install macOS SDK
        if: runner.os == 'macOS'
        run: brew install wxwidgets ninja libspng jpeg-turbo
      - name: Prepare supported vcpkg file cache
        if: runner.os == 'Windows'
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg-binaries'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "VCPKG_MAX_CONCURRENCY=2" >> $env:GITHUB_ENV
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'Runner vcpkg is unavailable' }
          $commit = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record runner vcpkg revision' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows dependency binaries
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-binaries
          key: toolkit-vcpkg-static-v1-${{ runner.os }}-${{ steps.vcpkg.outputs.image }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('neoshared/vcpkg-ports/**') }}
      - name: Install pinned wxWidgets Windows overlay
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./neoshared/scripts/install-wxwidgets.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT -Triplet x64-windows-static -CleanAfterBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NeoTPC codec dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libspng:x64-windows-static libjpeg-turbo:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure workspace application (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash NeoToolKit-Test/scripts/build.sh --ci-phase configure
      - name: Configure workspace application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./NeoToolKit-Test/scripts/build.ps1 -CiPhase configure
      - name: Compile workspace application and modules (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash NeoToolKit-Test/scripts/build.sh --ci-phase build
      - name: Compile workspace application and modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./NeoToolKit-Test/scripts/build.ps1 -CiPhase build
      - name: Package application (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash NeoToolKit-Test/scripts/build.sh --ci-phase package
      - name: Package application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./NeoToolKit-Test/scripts/build.ps1 -CiPhase package
      - name: Upload application packages and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoToolKit-Test-${{ needs.sources.outputs.version }}-${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            NeoToolKit-Test/build/ci/dist/*.zip
            NeoToolKit-Test/build/ci/dist/*.tar.gz
            NeoToolKit-Test/build/ci/dist/*.deb
            NeoToolKit-Test/build/ci/dist/*.sha256
            NeoToolKit-Test/build/ci/dist/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload configure, build, and dependency diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoToolKit-Test-diagnostics-${{ matrix.artifact }}-${{ github.run_number }}
          path: |
            NeoToolKit-Test/build/ci/ci-logs/
            NeoToolKit-Test/build/ci/CMakeCache.txt
            NeoToolKit-Test/build/ci/CMakeFiles/CMakeConfigureLog.yaml
            NeoToolKit-Test/build/ci/_CPack_Packages/**/CPack*.log
            NeoToolKit-Test/build/ci/dist/_CPack_Packages/**/CPack*.log
            .ci-logs/
            source-bundle/component-lock.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
